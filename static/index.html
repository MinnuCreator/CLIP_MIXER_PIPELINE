<!doctype html><html><head><meta charset="utf-8"><title>FrameForge</title><link rel="stylesheet" href="style.css"></head><body><main><h1>FrameForge</h1><p>Local narration-aware image synchronization. No paid API.</p><label>Upload voice-over <input id="audio" type="file" accept="audio/*"></label><p><small>FrameForge measures audio duration locally with FFprobe; no manual duration is needed.</small></p><h2>Images & prompts</h2><div id="images"></div><button id="add">Add image</button><button id="analyze">Analyze & Sync</button><button id="render" disabled>Render Video</button><p id="status"></p><h2>Timeline preview</h2><div id="timeline"></div><section id="rendered" hidden><h2>Rendered video</h2><video id="player" controls></video><p><a id="download" download>Download MP4</a></p></section><h2>Manual override</h2><textarea id="editor" rows="12" placeholder="Generated timeline JSON appears here for editing."></textarea><button id="save">Save edited timeline</button></main><script src="app.js"></script></body></html>
